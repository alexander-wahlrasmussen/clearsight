# Field criticality and comparison configuration (v2: multi-item).
#
# This file is the single source of truth for:
#   - which canonical fields are compared at all, header and item level,
#   - how critical each field is (its tier),
#   - which comparator judges it, and with which parameters,
#   - how severe a structural defect (missed / spurious goods item) is,
#   - the minimum similarity score at which items may be paired.
#
# Nothing about criticality is hardcoded in Python.  Moving a field between
# tiers, loosening a tolerance, switching a comparator, or deciding that a
# missed item is only tier 2 is an edit here and a re-run -- no code change.
#
# Tiers:
#   1  an error blocks or corrupts the filing (wrong duty, wrong compliance
#      outcome).  The headline clean_document_rate counts only these.
#   2  an error causes rework or downstream friction but the filing stands.
#   3  cosmetic / reference data; worth tracking, not worth alarming on.
#
# critical_tier controls which tier defines a "clean" document.
#
# Identity fields (shipment_id, doc_id, country, source_system, and item
# numbers) are not listed: doc_id is the join key, item numbers are context
# for alignment, and the rest is provenance, not extracted content.

version: 2
critical_tier: 1

# Header: one comparison per document.
header_fields:
  declared_value:          # invoice total
    tier: 1
    comparator: numeric_with_tolerance
    params: {pct: 0.5}     # customs value tolerance; anything beyond is a duty error

  currency:
    tier: 1
    comparator: exact_code

  importer_eori:
    tier: 1
    comparator: exact_code

  incoterm:
    tier: 2
    comparator: exact_code

  invoice_date:
    tier: 2
    comparator: normalised_date
    params: {dayfirst: true}   # DE/NL sources write day-first

  # fuzzy_name is built for party/consignee names; we exercise it here on
  # the bill-of-lading reference, the only free-ish text field the record
  # carries.  OCR character confusion (O/0, I/1, B/8) makes it a
  # reasonable fit.
  bl_reference:
    tier: 3
    comparator: fuzzy_name
    params: {threshold: 0.9}

# Items: one comparison per ALIGNED pair of goods items.
item_fields:
  hs_code:
    tier: 1
    comparator: exact_code

  origin_country:
    tier: 1
    comparator: iso_country

  item_value:
    tier: 1
    comparator: numeric_with_tolerance
    params: {pct: 0.5}

  quantity:
    tier: 2
    comparator: numeric_with_tolerance
    params: {pct: 0.0}     # counts must match exactly

  quantity_unit:           # a quantity in the wrong unit is not a quantity
    tier: 2
    comparator: exact_code

  net_weight:
    tier: 2
    comparator: numeric_with_tolerance
    params: {pct: 1.0}     # scales and rounding differ between systems

  gross_weight:
    tier: 2
    comparator: numeric_with_tolerance
    params: {pct: 1.0}

  package_count:
    tier: 3
    comparator: numeric_with_tolerance
    params: {pct: 0.0}

# Structural defects found by item alignment.  A filed item nothing was
# extracted for (missed_item) and an extracted item nothing was filed for
# (spurious_item) are whole-line failures, so they default to tier 1.
structure:
  missed_item_tier: 1
  spurious_item_tier: 1

# Items pair only when their similarity score clears this floor; below it
# they are reported unmatched instead of force-paired.  See alignment.py
# for the scoring.
alignment:
  min_score: 0.35
